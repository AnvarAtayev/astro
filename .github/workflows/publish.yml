name: Publish to Typst Universe

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version references
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/^version = .*/version = \"$VERSION\"/" typst.toml
          sed -i "s/@preview\/astro:[0-9]*\.[0-9]*\.[0-9]*/@preview\/astro:$VERSION/g" README.md
          sed -i "s/@preview\/astro:[0-9]*\.[0-9]*\.[0-9]*/@preview\/astro:$VERSION/g" docs/main.typ

      - name: Commit version bumps
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add typst.toml README.md docs/main.typ
          git commit -m "Bump version to ${{ steps.version.outputs.VERSION }}"
          git push https://AnvarAtayev:${{ secrets.PACKAGES_TOKEN }}@github.com/AnvarAtayev/astro.git HEAD:main

      - name: Clone packages fork
        run: |
          git clone https://AnvarAtayev:${{ secrets.PACKAGES_TOKEN }}@github.com/AnvarAtayev/packages.git
          git -C packages remote set-url origin https://AnvarAtayev:${{ secrets.PACKAGES_TOKEN }}@github.com/AnvarAtayev/packages.git

      - name: Fix example imports
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s|#import \"../src/bodies.typ\": \*|#import \"@preview/astro:$VERSION\": *|g" examples/*.typ

      - name: Copy package files
        run: |
          DEST=packages/packages/preview/astro/${{ steps.version.outputs.VERSION }}
          mkdir -p "$DEST"
          cp -r src examples README.md LICENSE typst.toml "$DEST/"

      - name: Open PR
        run: |
          cd packages
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b add-astro-${{ steps.version.outputs.VERSION }}
          git add .
          git commit -m "astro:${{ steps.version.outputs.VERSION }}"
          git push origin add-astro-${{ steps.version.outputs.VERSION }} --force
          printf '## astro v%s\nA package for drawing celestial bodies (planets, rings, surfaces) in Typst.\n- **Repository:** https://github.com/AnvarAtayev/astro\n- **License:** MIT\n' "${{ steps.version.outputs.VERSION }}" > ../pr-body.md
          gh pr create \
            --repo typst/packages \
            --title "astro:${{ steps.version.outputs.VERSION }}" \
            --body-file ../pr-body.md \
            --head "AnvarAtayev:add-astro-${{ steps.version.outputs.VERSION }}" \
          || echo "PR already exists, skipping."
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
