name: Publish to Typst Universe

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Clone packages fork
        run: |
          git clone https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/AnvarAtayev/packages.git
          git -C packages remote set-url origin https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/AnvarAtayev/packages.git

      - name: Copy package files
        run: |
          DEST=packages/packages/preview/astro/${{ steps.version.outputs.VERSION }}
          mkdir -p "$DEST"
          cp -r src README.md LICENSE typst.toml "$DEST/"

      - name: Open PR
        run: |
          cd packages
          git config user.email "anvar936@live.com"
          git config user.name "AnvarAtayev"
          git checkout -b add-astro-${{ steps.version.outputs.VERSION }}
          git add .
          git commit -m "Add astro:${{ steps.version.outputs.VERSION }}"
          git push origin add-astro-${{ steps.version.outputs.VERSION }}
          gh pr create \
            --repo typst/packages \
            --title "Add astro:${{ steps.version.outputs.VERSION }}" \
            --body "Automated submission of astro v${{ steps.version.outputs.VERSION }}" \
            --head "AnvarAtayev:add-astro-${{ steps.version.outputs.VERSION }}"
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}